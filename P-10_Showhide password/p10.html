<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        .box {
            background-color: white;
            padding: 25px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 10px;
        }

        h2 {
            color: darkblue;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Login Form</h2>

        <form>
            Username:<br>
            <input type="text" placeholder="Enter username">
            <br>

            Password:<br>
            <input type="password" id="pass" placeholder="Enter password">
            <br>

            <input type="checkbox" onclick="showPassword()">
            Show Password
        </form>
    </div>

    <script>
        function showPassword() {
            var p = document.getElementById("pass");

            if (p.type == "password") {
                p.type = "text";
            } else {
                p.type = "password";
            }
        }
    </script>
</body>
</html>
