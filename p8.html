<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Operations</title>

    <style>
        body {
            background-color: rgb(235, 98, 212);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        h2 {
            color: darkblue;
        }
    </style>
</head>

<body>
    <h2>Arithmetic Operations</h2>

    <h3>
    <script>
        var a = 20;
        var b = 10;

        document.write("First Number: " + a + "<br>");
        document.write("Second Number: " + b + "<br><br>");
        document.write("Addition: " + (a + b) + "<br>");
        document.write("Subtraction: " + (a - b) + "<br>");
        document.write("Multiplication: " + (a * b) + "<br>");
        document.write("Division: " + (a / b) + "<br>");
    </script>
    </h3>
</body>
</html>
